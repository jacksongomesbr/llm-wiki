name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          # `scandir: ./llm-wiki` skipped quickstart.sh, scripts/ and tests/
          # entirely. Scan the whole repo instead.
          scandir: "."
          additional_files: "uninstall.sh quickstart.sh"

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            CHANGELOG.md
            SUPPORT.md
            FAQ.md
            llm-wiki/**/*.md
            .github/**/*.md

  tests:
    name: Tests (${{ matrix.os }})
    # The scripts hash files and parse YAML with awk/sed; macOS ships BSD
    # variants and no `sha256sum`, so it needs its own run.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Behavioural test suite
        run: ./tests/run-tests.sh

  smoke:
    name: CLI Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts against a temporary wiki
        run: |
          set -e
          TMPDIR="$(mktemp -d)"
          cd "$TMPDIR"

          echo "=== init-wiki.sh ==="
          bash "$GITHUB_WORKSPACE/llm-wiki/scripts/init-wiki.sh"

          echo "=== hash-files.sh ==="
          bash "$GITHUB_WORKSPACE/llm-wiki/scripts/hash-files.sh" ./wiki

          echo "=== creating test pages ==="
          cat > ./wiki/test-concept.md << 'EOF'
          ---
          title: "Test Concept"
          type: concept
          language: en
          created: 2026-04-30
          modified: 2026-04-30
          tags: [test, example]
          summary: "A test page for CI validation"
          ---
          # Test Concept
          This is a test page. See [[other-page]] for more.
          EOF

          cat > ./wiki/other-page.md << 'EOF'
          ---
          title: "Other Page"
          type: article
          language: en
          created: 2026-04-30
          modified: 2026-04-30
          tags: [test]
          summary: "Another test page"
          ---
          # Other Page
          This links back to [[test-concept]].
          EOF

          echo "=== build-index.sh ==="
          bash "$GITHUB_WORKSPACE/llm-wiki/scripts/build-index.sh" ./wiki

          echo "=== validate-frontmatter.sh ==="
          bash "$GITHUB_WORKSPACE/llm-wiki/scripts/validate-frontmatter.sh" ./wiki

          echo "=== find-broken-links.sh ==="
          bash "$GITHUB_WORKSPACE/llm-wiki/scripts/find-broken-links.sh" ./wiki

          echo "=== find-orphans.sh ==="
          bash "$GITHUB_WORKSPACE/llm-wiki/scripts/find-orphans.sh" ./wiki

          echo "=== check-stale.sh (expect FRESH) ==="
          bash "$GITHUB_WORKSPACE/llm-wiki/scripts/check-stale.sh" ./wiki

          echo "=== --help flags ==="
          bash "$GITHUB_WORKSPACE/llm-wiki/install.sh" --help
          bash "$GITHUB_WORKSPACE/uninstall.sh" --help
          bash "$GITHUB_WORKSPACE/quickstart.sh" --help

          cd /tmp
          rm -rf "$TMPDIR"
          echo "=== All smoke tests passed ==="
