<!DOCTYPE html>
<!--
  Knowledge graph — generated by scripts/build-graph.sh.

  This file is a TEMPLATE. build-graph.sh replaces the placeholders below and
  writes the result to $WIKI_ROOT/.llm-wiki/graph.html. Edit the template, not
  the generated file: the generated one is overwritten on every build.

  Placeholders are substituted by build-graph.sh; see that script for the list.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__WIKI_NAME__ — Knowledge Graph</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f7f9; --border: #d8dce2; --fg: #1b1f24;
    --muted: #5c6570; --accent: #2f6feb; --dim: 0.12;
    --t-concept:#3f7fd0; --t-note:#d2762a; --t-entity:#4f9a52;
    --t-synthesis:#c8a02a; --t-project:#c0504d; --t-area:#7a5aa0; --t-source:#8a929c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#14171c; --panel:#1b1f26; --border:#2c323b; --fg:#e6e9ee;
      --muted:#9aa4b2; --accent:#5b9bd5; --dim:0.08;
      --t-concept:#5b9bd5; --t-note:#ed7d31; --t-entity:#70ad47;
      --t-synthesis:#ffc000; --t-project:#e06c69; --t-area:#a68cd0; --t-source:#78828f;
    }
  }
  :root[data-theme="dark"] {
    --bg:#14171c; --panel:#1b1f26; --border:#2c323b; --fg:#e6e9ee;
    --muted:#9aa4b2; --accent:#5b9bd5; --dim:0.08;
    --t-concept:#5b9bd5; --t-note:#ed7d31; --t-entity:#70ad47;
    --t-synthesis:#ffc000; --t-project:#e06c69; --t-area:#a68cd0; --t-source:#78828f;
  }
  :root[data-theme="light"] {
    --bg:#ffffff; --panel:#f6f7f9; --border:#d8dce2; --fg:#1b1f24;
    --muted:#5c6570; --accent:#2f6feb; --dim:0.12;
    --t-concept:#3f7fd0; --t-note:#d2762a; --t-entity:#4f9a52;
    --t-synthesis:#c8a02a; --t-project:#c0504d; --t-area:#7a5aa0; --t-source:#8a929c;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr;
    grid-template-areas: "bar bar" "canvas panel";
  }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto;
           grid-template-areas: "bar" "canvas" "panel"; }
    #panel { max-height: 45vh; border-left: none; border-top: 1px solid var(--border); }
  }

  #bar {
    grid-area: bar; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  #bar input[type=search] {
    padding: 5px 9px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--fg); min-width: 180px;
  }
  .chip {
    border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
    cursor: pointer; user-select: none; font-size: 12px; background: var(--bg);
  }
  .chip[aria-pressed="false"] { opacity: .4; }
  .chip .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 5px; vertical-align: baseline;
  }
  #bar label { font-size: 12px; color: var(--muted); }
  button {
    font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--fg);
  }

  #canvas { grid-area: canvas; position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg:active { cursor: grabbing; }
  .link { stroke: var(--muted); stroke-opacity: .35; }
  .link.cite { stroke-dasharray: 3 3; stroke-opacity: .5; }
  .node { cursor: pointer; stroke: var(--bg); stroke-width: 1.5px; }
  .node.pinned { stroke: var(--accent); stroke-width: 2.5px; }
  .node.stub { stroke-dasharray: 2 2; }
  .node.source { stroke-width: 1px; }
  .faded { opacity: var(--dim); }
  .label { font-size: 10px; fill: var(--muted); pointer-events: none; }
  .node:focus { outline: none; }
  .node.kbfocus { stroke: var(--accent); stroke-width: 3px; }
  #svg:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  #panel {
    grid-area: panel; border-left: 1px solid var(--border); background: var(--panel);
    overflow-y: auto; padding: 14px;
  }
  #panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 18px 0 8px; font-weight: 600;
  }
  #panel h2:first-child { margin-top: 0; }
  #panel h3 { margin: 0 0 2px; font-size: 16px; }
  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 2px 8px; font-size: 12px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .summary { font-size: 13px; margin: 8px 0 0; }
  #panel ul { margin: 4px 0 0; padding-left: 16px; font-size: 13px; }
  #panel a { color: var(--accent); cursor: pointer; text-decoration: none; }
  #panel a:hover { text-decoration: underline; }
  .empty { color: var(--muted); font-style: italic; font-size: 13px; }
  .badge {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); margin-right: 4px;
  }
</style>
</head>
<body>

<div id="bar">
  <strong style="font-size:13px">__WIKI_NAME__</strong>
  <input type="search" id="search" placeholder="Search pages…" aria-label="Search pages">
  <span id="chips"></span>
  <label>focus <input type="range" id="depth" min="0" max="3" value="0" style="width:70px"></label>
  <label><input type="checkbox" id="showCites"> citations</label>
  <label><input type="checkbox" id="showLabels" checked> labels</label>
  <button id="reset">Reset</button>
  <button id="theme">Theme</button>
</div>

<div id="canvas">
  <svg id="svg" role="application" tabindex="0"
       aria-label="Knowledge graph. Tab moves between pages, Enter selects, P pins."></svg>
</div>

<aside id="panel" aria-live="polite">
  <h2>Graph</h2>
  <dl class="kv" id="graphStats"></dl>
  <h2>Selected</h2>
  <div id="detail"><p class="empty">Click a node. Double-click pins it.</p></div>
</aside>

<script>window.GRAPH = __GRAPH_DATA__;</script>
__D3_SCRIPT_TAG__
<script>
(function () {
  "use strict";
  var G = window.GRAPH;
  if (!window.d3) {
    document.getElementById("detail").innerHTML =
      '<p class="empty">D3 failed to load. Run <code>scripts/vendor-d3.sh</code> ' +
      'to keep a local copy, then regenerate.</p>';
    return;
  }

  var TYPES = ["concept", "note", "entity", "project", "area", "synthesis"];
  var colorOf = function (t) {
    return getComputedStyle(document.documentElement)
      .getPropertyValue("--t-" + t).trim() || "#888";
  };
  // d3 v7 has no hexagon; wye stands in for `work`.
  var SHAPES = {
    person: d3.symbolCircle, organization: d3.symbolSquare, tool: d3.symbolTriangle,
    place: d3.symbolDiamond, work: d3.symbolWye, event: d3.symbolStar
  };

  var nodes = G.nodes.map(function (n) { return Object.assign({}, n); });
  var byId = {};
  nodes.forEach(function (n) { byId[n.id] = n; });

  var links = G.edges
    .filter(function (e) { return byId[e.source] && byId[e.target]; })
    .map(function (e) { return { source: e.source, target: e.target, kind: e.kind || "link" }; });

  // Adjacency, used for neighbourhood focus.
  var adj = {};
  nodes.forEach(function (n) { adj[n.id] = []; });
  links.forEach(function (l) {
    if (l.kind !== "link") return;
    adj[l.source].push(l.target);
    adj[l.target].push(l.source);
  });

  var svg = d3.select("#svg");
  var root = svg.append("g");
  var linkSel = root.append("g").attr("class", "links").selectAll("line");
  var nodeSel = root.append("g").attr("class", "nodes").selectAll("path");
  var labelSel = root.append("g").attr("class", "labels").selectAll("text");

  svg.call(d3.zoom().scaleExtent([0.15, 6]).on("zoom", function (ev) {
    root.attr("transform", ev.transform);
  }));

  var sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(function (d) { return d.id; }).distance(70))
    .force("charge", d3.forceManyBody().strength(-260))
    .force("collide", d3.forceCollide().radius(function (d) { return radius(d) + 6; }))
    .force("center", d3.forceCenter(0, 0));

  function fitToViewport() {
    var box = document.getElementById("canvas").getBoundingClientRect();
    sim.force("center", d3.forceCenter(box.width / 2, box.height / 2));
    sim.alpha(0.3).restart();
  }
  fitToViewport();
  window.addEventListener("resize", fitToViewport);

  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    // Settle without animating: a force simulation is a lot of motion.
    sim.stop();
    for (var i = 0; i < 250; i++) sim.tick();
  }

  function radius(d) {
    if (d.type === "source") return 4 + Math.min(d.inDegree || 0, 6);
    return 5 + Math.min(d.inDegree || 0, 15);
  }

  function draw() {
    linkSel = linkSel.data(links).join("line")
      .attr("class", function (d) { return "link " + (d.kind === "cite" ? "cite" : ""); });

    nodeSel = nodeSel.data(nodes, function (d) { return d.id; }).join("path")
      .attr("class", function (d) {
        return "node" + (d.status === "stub" ? " stub" : "") +
               (d.type === "source" ? " source" : "") + (d.fx != null ? " pinned" : "");
      })
      .attr("d", function (d) {
        var shape = (d.type === "entity" && SHAPES[d.class]) ? SHAPES[d.class] : d3.symbolCircle;
        return d3.symbol().type(shape).size(Math.PI * radius(d) * radius(d))();
      })
      .attr("fill", function (d) { return colorOf(d.type); })
      .attr("opacity", function (d) { return d.status === "archived" ? 0.45 : 1; })
      .attr("tabindex", 0)
      .attr("role", "button")
      .attr("aria-label", function (d) { return d.title + ", " + kindOf(d); })
      .on("click", function (ev, d) { select(d.id); })
      .on("keydown", function (ev, d) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(d.id); }
        if (ev.key === "p" || ev.key === "P") {
          d.fx = d.fx == null ? d.x : null;
          d.fy = d.fy == null ? d.y : null;
          sim.alpha(0.1).restart();
          draw();
        }
      })
      .on("dblclick", function (ev, d) {
        d.fx = d.fx == null ? d.x : null;
        d.fy = d.fy == null ? d.y : null;
        sim.alpha(0.1).restart();
        draw();
      })
      .call(d3.drag()
        .on("start", function (ev, d) {
          if (!ev.active) sim.alphaTarget(0.25).restart();
          d.fx = d.x; d.fy = d.y;
        })
        .on("drag", function (ev, d) { d.fx = ev.x; d.fy = ev.y; })
        .on("end", function (ev, d) { if (!ev.active) sim.alphaTarget(0); draw(); }));

    nodeSel.selectAll("title").remove();
    nodeSel.append("title").text(function (d) { return d.title + " — " + kindOf(d); });

    labelSel = labelSel.data(nodes, function (d) { return d.id; }).join("text")
      .attr("class", "label").attr("dy", function (d) { return -radius(d) - 4; })
      .attr("text-anchor", "middle").text(function (d) { return d.title; });

    applyFilter();
  }

  sim.on("tick", function () {
    linkSel
      .attr("x1", function (d) { return d.source.x; }).attr("y1", function (d) { return d.source.y; })
      .attr("x2", function (d) { return d.target.x; }).attr("y2", function (d) { return d.target.y; });
    nodeSel.attr("transform", function (d) { return "translate(" + d.x + "," + d.y + ")"; });
    labelSel.attr("x", function (d) { return d.x; }).attr("y", function (d) { return d.y; });
  });

  function kindOf(d) { return d.type + (d.class ? "/" + d.class : ""); }

  // ── Filtering, search and neighbourhood focus ────────────────────────────
  var active = {}; TYPES.forEach(function (t) { active[t] = true; });
  var selected = null, depth = 0, query = "";

  function withinDepth(id) {
    if (!selected || depth === 0) return null;
    var seen = {}, frontier = [selected], d = 0;
    seen[selected] = true;
    while (d < depth) {
      var next = [];
      frontier.forEach(function (f) {
        (adj[f] || []).forEach(function (n) { if (!seen[n]) { seen[n] = true; next.push(n); } });
      });
      frontier = next; d++;
    }
    return seen;
  }

  function applyFilter() {
    var near = withinDepth();
    var q = query.toLowerCase();
    var cites = document.getElementById("showCites").checked;

    function pageVisible(d) {
      if (!active[d.type]) return false;
      if (near && !near[d.id]) return false;
      if (q && d.title.toLowerCase().indexOf(q) < 0 && d.id.indexOf(q) < 0) return false;
      return true;
    }

    // A source is shown when the citation layer is on AND some visible page
    // cites it — otherwise focusing on one corner of the wiki still left the
    // whole bibliography floating on screen.
    var citedByVisible = {};
    if (cites) {
      links.forEach(function (l) {
        if (l.kind !== "cite") return;
        var s = byId[l.source.id || l.source], t = l.target.id || l.target;
        if (s && s.type !== "source" && pageVisible(s)) citedByVisible[t] = true;
      });
    }

    function visible(d) {
      // Bibliography entries are a layer, not a page type.
      if (d.type === "source") return cites && !!citedByVisible[d.id];
      return pageVisible(d);
    }
    nodeSel.classed("faded", function (d) { return !visible(d); })
           .attr("display", function (d) { return (d.type === "source" && !visible(d)) ? "none" : null; });
    labelSel.classed("faded", function (d) { return !visible(d); })
            .attr("display", function (d) {
              if (d.type === "source" && !visible(d)) return "none";
              return document.getElementById("showLabels").checked ? null : "none";
            });
    linkSel.classed("faded", function (d) { return !visible(d.source) || !visible(d.target); })
           .attr("display", function (d) {
             return (d.kind === "cite" && !document.getElementById("showCites").checked) ? "none" : null;
           });
  }

  // ── Right panel ─────────────────────────────────────────────────────────
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function statsHtml() {
    var pages = nodes.filter(function (n) { return n.type !== "source"; });
    var sources = nodes.length - pages.length;
    var orphans = pages.filter(function (n) { return !n.inDegree; }).length;
    var hubs = pages.filter(function (n) { return n.isHub; }).length;
    var rows = [
      ["Pages", pages.length],
      ["Sources", sources],
      ["Links", links.filter(function (l) { return l.kind === "link"; }).length],
      ["Orphans", orphans],
      ["Hubs", hubs],
      ["Components", G.components],
      ["Generated", G.generated]
    ];
    return rows.map(function (r) {
      return "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>";
    }).join("");
  }

  function select(id) {
    selected = id;
    nodeSel.classed("kbfocus", function (n) { return n.id === id; });
    location.hash = "node=" + id;
    var d = byId[id];
    var back = [], out = [];
    links.forEach(function (l) {
      var s = l.source.id || l.source, t = l.target.id || l.target;
      // For a bibliography entry, "what links here" means the pages citing it,
      // which are cite edges — counting only page-to-page links reported zero.
      var relevant = (d.type === "source") ? (l.kind === "cite") : (l.kind === "link");
      if (!relevant) return;
      if (t === id) back.push(s);
      if (s === id) out.push(t);
    });

    function list(arr) {
      if (!arr.length) return '<p class="empty">None.</p>';
      return "<ul>" + arr.sort().map(function (s) {
        return '<li><a data-goto="' + esc(s) + '">' + esc((byId[s] || {}).title || s) + "</a></li>";
      }).join("") + "</ul>";
    }

    var fm = "";
    Object.keys(d.frontmatter || {}).forEach(function (k) {
      fm += "<dt>" + esc(k) + "</dt><dd>" + esc(d.frontmatter[k]) + "</dd>";
    });

    var srcs = (d.references || []).length
      ? "<ul>" + d.references.map(function (k) { return "<li><code>" + esc(k) + "</code></li>"; }).join("") + "</ul>"
      : '<p class="empty">No sources recorded.</p>';

    document.getElementById("detail").innerHTML =
      "<h3>" + esc(d.title) + "</h3>" +
      '<div style="margin:4px 0 10px">' +
        '<span class="badge" style="border-color:' + colorOf(d.type) + '">' + esc(kindOf(d)) + "</span>" +
        (d.status ? '<span class="badge">' + esc(d.status) + "</span>" : "") +
      "</div>" +
      (d.summary ? '<p class="summary">' + esc(d.summary) + "</p>" : "") +
      (d.path ? '<p style="margin:10px 0 0"><a href="' + esc(d.path) + '">' +
        (d.type === "source" ? "Open source →" : "Open page →") + "</a></p>" : "") +
      "<h2>Frontmatter</h2><dl class=\"kv\">" + (fm || "<dd class='empty'>None.</dd>") + "</dl>" +
      "<h2>" + (d.type === "source" ? "Cited by (" : "Backlinks (") + back.length + ")</h2>" + list(back) +
      (d.type === "source" ? "" :
        "<h2>Links out (" + out.length + ")</h2>" + list(out) +
        "<h2>Sources (" + ((d.references || []).length) + ")</h2>" + srcs);

    applyFilter();
  }

  document.getElementById("panel").addEventListener("click", function (ev) {
    var a = ev.target.closest("a[data-goto]");
    if (a) { ev.preventDefault(); select(a.getAttribute("data-goto")); }
  });

  // ── Controls ────────────────────────────────────────────────────────────
  var chips = document.getElementById("chips");
  TYPES.forEach(function (t) {
    var b = document.createElement("button");
    b.className = "chip"; b.setAttribute("aria-pressed", "true");
    b.innerHTML = '<span class="dot" style="background:' + colorOf(t) + '"></span>' + t;
    b.onclick = function () {
      active[t] = !active[t];
      b.setAttribute("aria-pressed", String(active[t]));
      applyFilter();
    };
    chips.appendChild(b);
  });

  document.getElementById("search").oninput = function (e) { query = e.target.value; applyFilter(); };
  document.getElementById("depth").oninput = function (e) { depth = +e.target.value; applyFilter(); };
  document.getElementById("showCites").onchange = applyFilter;
  document.getElementById("showLabels").onchange = applyFilter;
  document.getElementById("reset").onclick = function () {
    selected = null; depth = 0; query = "";
    document.getElementById("search").value = "";
    document.getElementById("depth").value = 0;
    TYPES.forEach(function (t) { active[t] = true; });
    chips.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", "true"); });
    document.getElementById("detail").innerHTML =
      '<p class="empty">Click a node. Double-click pins it.</p>';
    location.hash = "";
    applyFilter();
  };
  document.getElementById("theme").onclick = function () {
    var r = document.documentElement;
    var now = r.getAttribute("data-theme");
    var dark = now ? now === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
    draw();
  };

  document.getElementById("graphStats").innerHTML = statsHtml();
  draw();

  var m = /node=([^&]+)/.exec(location.hash);
  if (m && byId[decodeURIComponent(m[1])]) select(decodeURIComponent(m[1]));
})();
</script>
</body>
</html>
